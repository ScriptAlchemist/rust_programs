# Source this from ~/.tmux.conf after installing the timer binary:
#   cargo install --path /Users/justinbender/projects/rust_programs/timer
#   source-file /Users/justinbender/projects/rust_programs/timer/tmux/timer.tmux.conf

# Start a background timer in tmux status-right without keeping a pane open.
bind-key T command-prompt -p "timer duration" "run-shell -b 'timer --tmux --quiet --tmux-target \"#{session_name}\" %%'"

# Start a background timer with a prompted color.
bind-key C-t command-prompt -p "timer duration,timer color" "run-shell -b 'timer --tmux --quiet --tmux-target \"#{session_name}\" --color %2 %1'"

# Cancel the active background timer, if one is running.
bind-key X run-shell -b 'pid="$(tmux show-option -qv -t "#{session_name}" @timer_pid)"; if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid"; tmux display-message "Timer canceled"; else tmux display-message "No tmux timer running"; fi'
