# Source this from ~/.tmux.conf after installing the timer binary:
#   cargo install --path /Users/justinbender/projects/rust_programs/timer
#   source-file /Users/justinbender/projects/rust_programs/timer/tmux/timer.tmux.conf

# Start a background timer in tmux status-right without keeping a pane open.
bind-key T command-prompt -p "timer duration" "run-shell -b 'timer --tmux --quiet --tmux-target \"#{session_name}\" %%'"

# Start a background timer with a prompted color.
bind-key C-t command-prompt -p "timer duration,timer color" "run-shell -b 'timer --tmux --quiet --tmux-target \"#{session_name}\" --color %2 %1'"

# Start a background stopwatch.
bind-key S run-shell -b 'timer --tmux --quiet --tmux-target "#{session_name}" stopwatch'

# Pause or resume the active background timer or stopwatch.
bind-key P run-shell -b 'pid="$(tmux show-option -qv -t "#{session_name}" @timer_pid)"; if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then paused="$(tmux show-option -qv -t "#{session_name}" @timer_paused)"; if [ "$paused" = "1" ]; then tmux set-option -q -t "#{session_name}" @timer_control resume; tmux display-message "Timer/stopwatch resumed"; else tmux set-option -q -t "#{session_name}" @timer_control pause; tmux display-message "Timer/stopwatch paused"; fi; else tmux display-message "No tmux timer or stopwatch running"; fi'

# Restart the active background timer from its original duration or reset the stopwatch to zero.
bind-key R run-shell -b 'pid="$(tmux show-option -qv -t "#{session_name}" @timer_pid)"; if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then tmux set-option -q -t "#{session_name}" @timer_control restart; tmux display-message "Timer/stopwatch restarted"; else tmux display-message "No tmux timer or stopwatch running"; fi'

# Cancel the active background timer or stopwatch, if one is running.
bind-key X run-shell -b 'pid="$(tmux show-option -qv -t "#{session_name}" @timer_pid)"; if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid"; tmux display-message "Timer/stopwatch stopped"; else tmux display-message "No tmux timer or stopwatch running"; fi'
